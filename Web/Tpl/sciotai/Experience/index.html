<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>工业智能体体验中心 - 左帮右臂</title>
</head>
<body>
<div style="background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff;padding:60px 20px 40px;text-align:center">
  <h1 style="font-size:36px;margin-bottom:12px">🤖 工业智能体体验中心</h1>
  <p style="font-size:16px;opacity:.8">无需注册，即开即用。选择下方智能体，快速体验AI带来的效率提升。</p>
</div>
<div style="max-width:1100px;margin:0 auto;padding:30px 20px">
  <div id="skillGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:30px"></div>
  <div id="workspace" style="display:none;background:#fff;border-radius:16px;padding:30px">
    <h2 id="wsTitle" style="margin-bottom:16px;font-size:20px"></h2>
    <input type="hidden" id="currentSkill">
    <div><textarea id="inputArea" rows="6" style="width:100%;padding:12px;border:1px solid #dde3ed;border-radius:10px;font-size:14px;resize:vertical" placeholder="请输入数据..."></textarea></div>
    <div style="margin:12px 0">
      <button onclick="runSkill()" style="padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;background:linear-gradient(135deg,#07f,#0df);color:#fff">🚀 立即体验</button>
      <button onclick="loadSample()" style="padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:#07f;border:1px solid #07f;margin-left:8px">📄 用示例数据</button>
    </div>
    <div id="loading" style="display:none;text-align:center;padding:30px;color:#666">⏳ AI正在分析...</div>
    <div id="errorMsg" style="display:none;color:#e74c3c;padding:12px;background:#fff0f0;border-radius:8px;margin-bottom:12px"></div>
    <div id="resultBox" style="display:none;padding:20px;background:#f8faff;border-radius:12px">
      <h3 style="margin-bottom:12px">📊 分析结果</h3>
      <div id="resultContent" style="font-size:14px;line-height:1.7"></div>
    </div>
  </div>
</div>
<script>
var API = window.location.hostname === "localhost" ? "/api/experience" : "https://bossagents.cn/api/experience";
var SKILLS = [
  {id:"bom_compare", name:"BOM结构比对", desc:"检测BOM结构缺失、层级异常、物料重复等问题", icon:"📋", cls:"#e8f4fd"},
  {id:"process_optimize", name:"工艺参数优化", desc:"AI分析工艺参数，给出优化建议和效率提升方案", icon:"⚙️", cls:"#e8f8f0"},
  {id:"content_generate", name:"智能内容生成", desc:"输入话题，AI自动生成微信公众号风格技术文章", icon:"✍️", cls:"#f0ecfe"}
];
var SAMPLES = {
  bom_compare: "物料编码:BOM-001,名称:底座,数量:2,层级:1",
  process_optimize: "焊接工艺：电流200A，电压24V，速度30cm/min",
  content_generate: "如何用AI降低制造业BOM错误率"
};

function initGrid() {
  var g = document.getElementById("skillGrid");
  if (!g) return;
  var h = "";
  for (var i = 0; i < SKILLS.length; i++) {
    var s = SKILLS[i];
    h += "<div onclick=\"openSkill('" + s.id + "')\" style=\"background:#fff;border-radius:16px;padding:28px;cursor:pointer;border:1px solid #eef2f7;transition:all .3s;text-align:center\"";
    h += " onmouseover=\"this.style.transform='translateY(-4px)';this.style.boxShadow='0 8px 30px rgba(0,119,255,.12)'\"";
    h += " onmouseout=\"this.style.transform='';this.style.boxShadow=''\">";
    h += "<div style=\"width:64px;height:64px;border-radius:16px;background:" + s.cls + ";display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 16px\">" + s.icon + "</div>";
    h += "<h3 style=\"font-size:18px;color:#1a1a2e;margin-bottom:8px\">" + s.name + "</h3>";
    h += "<p style=\"font-size:14px;color:#666;line-height:1.5;margin-bottom:16px\">" + s.desc + "</p>";
    h += "<span style=\"display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;background:#f0f5ff;color:#07f\">⏱ 约30秒</span></div>";
  }
  g.innerHTML = h;
}

function openSkill(id) {
  for (var i = 0; i < SKILLS.length; i++) {
    if (SKILLS[i].id === id) {
      document.getElementById("wsTitle").textContent = "📋 " + SKILLS[i].name;
      break;
    }
  }
  document.getElementById("currentSkill").value = id;
  document.getElementById("inputArea").value = SAMPLES[id] || "";
  document.getElementById("workspace").style.display = "block";
  document.getElementById("resultBox").style.display = "none";
  document.getElementById("loading").style.display = "none";
  document.getElementById("errorMsg").style.display = "none";
}

function loadSample() {
  var id = document.getElementById("currentSkill").value;
  if (id && SAMPLES[id]) document.getElementById("inputArea").value = SAMPLES[id];
}

function runSkill() {
  var id = document.getElementById("currentSkill").value;
  if (!id) return;
  var input = document.getElementById("inputArea").value.trim();
  if (!input) { alert("请输入数据"); return; }
  document.getElementById("loading").style.display = "block";
  document.getElementById("resultBox").style.display = "none";
  document.getElementById("errorMsg").style.display = "none";
  fetch(API + "/run/" + id, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({text: input})
  }).then(function(r) { return r.json(); }).then(function(d) {
    document.getElementById("loading").style.display = "none";
    if (!d.success) {
      document.getElementById("errorMsg").textContent = "❌ " + (d.error || "处理失败");
      document.getElementById("errorMsg").style.display = "block";
      return;
    }
    var html = "";
    if (d.result && d.result.highlight) {
      html += "<div style=\"padding:12px;background:#e8f4fd;border-radius:8px;color:#07f;font-weight:600;margin-bottom:12px\">💡 " + d.result.highlight + "</div>";
    }
    if (d.result && d.result.issues && d.result.issues.length > 0) {
      for (var j = 0; j < d.result.issues.length; j++) {
        var x = d.result.issues[j];
        var c = x.severity === "high" ? "#e74c3c" : "#f39c12";
        html += "<div style=\"padding:8px 12px;margin:6px 0;background:#fff;border-radius:6px;border-left:3px solid " + c + ";font-size:14px\">";
        html += (x.severity === "high" ? "🔴" : "🟡") + " <strong>" + x.type + "</strong>：" + x.detail + "</div>";
      }
    }
    if (d.result && d.result.content) {
      html += "<div style=\"padding:12px;background:#f8faff;border-radius:8px;line-height:1.7;font-size:14px\">" + d.result.content.substring(0, 2000) + "</div>";
    }
    document.getElementById("resultContent").innerHTML = html;
    document.getElementById("resultBox").style.display = "block";
  }).catch(function(e) {
    document.getElementById("loading").style.display = "none";
    document.getElementById("errorMsg").textContent = "❌ 网络错误: " + e.message;
    document.getElementById("errorMsg").style.display = "block";
  });
}

initGrid();
</script>
</body>
</html>
