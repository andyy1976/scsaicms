<!DOCTYPE html><html><head><meta charset="UTF-8"><title>体验中心</title><link rel="stylesheet" href="__TMPL__css/bootstrap.min.css"><style>body{font-family:-apple-system,sans-serif;background:#f0f5ff}.hero{background:linear-gradient(135deg,#1a1a2e,#0f3460);color:#fff;padding:60px 20px;text-align:center}.hero h1{font-size:36px;background:linear-gradient(90deg,#4facfe,#00f2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.container{max-width:1100px;margin:0 auto;padding:30px 20px}.skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.skill-card{background:#fff;border-radius:16px;padding:28px;cursor:pointer;border:1px solid #eef2f7;transition:all .3s}.skill-card:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,119,255,.12)}.skill-card .icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px}.icon.blue{background:#e8f4fd;color:#07f}.icon.green{background:#e8f8f0;color:#0b8}.icon.purple{background:#f0ecfe;color:#6c5ce7}.skill-card h3{font-size:18px;color:#1a1a2e}.skill-card p{font-size:14px;color:#666;line-height:1.5}.tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;background:#f0f5ff;color:#07f}.workspace{background:#fff;border-radius:16px;padding:30px;display:none;margin-bottom:30px}.workspace.active{display:block}.form-group textarea{width:100%;padding:12px;border:1px solid #dde3ed;border-radius:10px;font-size:14px;resize:vertical}.btn{display:inline-flex;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;gap:8px}.btn-primary{background:linear-gradient(135deg,#07f,#0df);color:#fff}.btn-outline{background:#fff;color:#07f;border:1px solid #07f}.loading{display:none;text-align:center;padding:30px}.loading.active{display:block}.result-box{display:none;margin-top:20px;padding:20px;background:#f8faff;border-radius:12px}.result-box.active{display:block}.error-msg{color:#e74c3c;padding:12px;background:#fff0f0;border-radius:8px;display:none}.error-msg.active{display:block}</style></head><body><div class="hero"><h1>🤖 工业智能体体验中心</h1><p>无需注册，即开即用</p></div><div class="container"><div class="skill-grid" id="skillGrid"></div><div class="workspace" id="workspace"><h2 id="wsTitle"></h2><div class="form-group"><textarea id="inputArea" rows="6" placeholder="请输入数据..."></textarea></div><p><button class="btn btn-primary" onclick="runSkill()">🚀 立即体验</button> <button class="btn btn-outline" onclick="loadSample()">📄 用示例数据</button></p><div class="loading" id="loading"><p>⏳ AI正在分析...</p></div><div class="error-msg" id="errorMsg"></div><div class="result-box" id="resultBox"><h3>📊 分析结果</h3><div id="resultContent"></div></div></div></div><script>var API=window.location.hostname==="localhost"?"":"https://bossagents.cn/api/experience";var SKILLS=[{id:"bom_compare",name:"BOM结构比对",desc:"检测结构缺失、层级异常、物料重复",icon:"📋",cls:"blue"},{id:"process_optimize",name:"工艺参数优化",desc:"AI给出参数调整和效率提升建议",icon:"⚙️",cls:"green"},{id:"content_generate",name:"智能内容生成",desc:">输入话题，自动生成技术文章",icon:"✍️",cls:"purple"}];var SAMPLES={bom_compare:"物料编码:BOM-001,名称:底座,数量:2,层级:1
物料编码:BOM-002,名称:螺丝M8,数量:12,层级:2",process_optimize:"焊接工艺：电流200A，电压24V，速度30cm/min",content_generate:"如何用AI降低制造业BOM错误率"};function init(){var g=document.getElementById("skillGrid");SKILLS.forEach(function(s){g.innerHTML+="<div class="skill-card" onclick="openSkill('"+s.id+"')"><div class="icon "+s.cls+"">"+s.icon+"</div><h3>"+s.name+"</h3><p>"+s.desc+"</p><span class="tag">⏱ 约30秒</span></div>"})}function openSkill(id){document.getElementById("wsTitle").textContent=SKILLS.find(function(s){return s.id===id}).name;document.getElementById("currentSkill").value=id;document.getElementById("inputArea").value=SAMPLES[id]||"";document.getElementById("workspace").className="workspace active";document.getElementById("resultBox").className="result-box";document.getElementById("loading").className="loading";document.getElementById("errorMsg").className="error-msg"}function loadSample(){var id=document.getElementById("currentSkill").value;if(id)document.getElementById("inputArea").value=SAMPLES[id]||""}function runSkill(){var id=document.getElementById("currentSkill").value;var input=document.getElementById("inputArea").value.trim();if(!input)return;document.getElementById("loading").className="loading active";document.getElementById("resultBox").className="result-box";document.getElementById("errorMsg").className="error-msg";fetch(API+"/run/"+id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:input})}).then(function(r){return r.json()}).then(function(d){document.getElementById("loading").className="loading";if(!d.success){document.getElementById("errorMsg").textContent="❌ "+(d.error||"失败");document.getElementById("errorMsg").className="error-msg active";return}var html="";if(d.result.highlight)html+="<div style="padding:12px;background:#e8f4fd;border-radius:8px;color:#07f;font-weight:600">💡 "+d.result.highlight+"</div>";if(d.result.issues&&d.result.issues.length>0){d.result.issues.forEach(function(x,i){html+="<div style="padding:8px 12px;margin:6px 0;background:#fff;border-radius:6px;border-left:3px solid "+(x.severity==="high"?"#e74c3c":"#f39c12")+"">"+(x.severity==="high"?"🔴":"🟡")+" "+x.type+"："+x.detail+"</div>"})}if(d.result.content)html+="<div style="padding:12px;background:#f8faff;border-radius:8px;line-height:1.7">"+d.result.content.substring(0,2000)+"</div>";document.getElementById("resultContent").innerHTML=html;document.getElementById("resultBox").className="result-box active";showConversionPrompt()}).catch(function(e){document.getElementById("loading").className="loading";document.getElementById("errorMsg").textContent="❌ 网络错误";document.getElementById("errorMsg").className="error-msg active"})}init();</script>
<!-- 注册转化CTA -->
<div id="conversionPrompt" class="card" style="display:none;margin-top:24px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:16px;padding:30px;text-align:center;color:#fff">
  <h3 style="font-size:20px;margin-bottom:8px">🎉 觉得不错？</h3>
  <p style="font-size:14px;opacity:.9;margin-bottom:16px">注册即可获得7天全功能试用，分享还能解锁更多Skill！</p>
  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
    <input id="regEmail" type="email" placeholder="输入邮箱开始试用" style="padding:12px 16px;border:none;border-radius:10px;font-size:14px;width:240px">
    <button class="btn" style="background:#fff;color:#667eea;font-weight:700;padding:12px 28px" onclick="registerTrial()">🚀 免费试用</button>
  </div>
  <div style="margin-top:12px;font-size:13px;opacity:.8">
    或 <a href="#" onclick="shareAndUnlock();return false" style="color:#fff;text-decoration:underline">分享给同行</a> 立即解锁全部Skill
  </div>
</div>

<script>
var CONV_API = API;

function showConversionPrompt() {
  // Check if user has already registered (stored in localStorage)
  var registered = localStorage.getItem('zbyb_registered');
  if (registered) {
    // Already registered, just record activity
    fetch(CONV_API+'/conversion/activity', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:registered,type:'experience'})}).catch(function(){});
    return;
  }
  document.getElementById('conversionPrompt').style.display = 'block';
}

function registerTrial() {
  var email = document.getElementById('regEmail').value.trim();
  if (!email || !email.includes('@')) { alert('请输入有效邮箱'); return; }
  fetch(CONV_API+'/conversion/register', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})})
  .then(function(r){return r.json()}).then(function(d){
    if(d.success){
      localStorage.setItem('zbyb_registered', email);
      document.getElementById('conversionPrompt').innerHTML = '<h3 style="font-size:20px">✅ 试用已开通！</h3><p style="font-size:14px;opacity:.9">7天全功能试用已激活，所有Skill已解锁</p>';
      alert('🎉 7天试用已开通！欢迎体验全部功能');
    } else {
      alert('注册失败: '+(d.error||'未知错误'));
    }
  }).catch(function(){alert('网络错误')});
}

function shareAndUnlock() {
  var shareText = '我刚体验了左帮右臂工业智能体，太强了！你也来试试 → '+window.location.href;
  if (navigator.share) {
    navigator.share({title:'左帮右臂',text:shareText,url:window.location.href}).then(function(){
      recordShareAndUnlock();
    }).catch(function(){});
  } else {
    navigator.clipboard.writeText(shareText).then(function(){
      alert('✅ 分享文案已复制！分享给3个好友即可解锁全部Skill');
      recordShareAndUnlock();
    }).catch(function(){prompt('复制以下链接分享：',shareText)});
  }
}

function recordShareAndUnlock() {
  var email = localStorage.getItem('zbyb_registered');
  if (email) {
    fetch(CONV_API+'/conversion/activity',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,type:'share'})}).catch(function(){});
  }
  // Show unlock progress
  var shareCount = parseInt(localStorage.getItem('zbyb_share_count')||'0') + 1;
  localStorage.setItem('zbyb_share_count', shareCount);
  if (shareCount >= 3) {
    alert('🎉 已分享3次！全部Skill已解锁');
  } else {
    alert('📤 已记录分享！再分享'+(3-shareCount)+'次即可解锁全部Skill');
  }
}
</script>

</body></html>
