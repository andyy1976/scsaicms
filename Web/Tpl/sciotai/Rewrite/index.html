<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS内容AI化 - 内容数字员工</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1f4e;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-select:focus {
            outline: none;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .action-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .action-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn.selected {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border-color: #6c5ce7;
        }

        .platform-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .platform-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .platform-btn.selected {
            background: linear-gradient(135deg, #00b894, #55efc4);
            color: white;
            border-color: #00b894;
        }

        .submit-btn {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .article-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .article-item {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .article-item:hover {
            background: #f8f9ff;
        }

        .article-item.selected {
            background: #f0f0ff;
            border-left: 4px solid #6c5ce7;
        }

        .article-title {
            font-size: 15px;
            font-weight: 500;
            color: #1a1f4e;
            margin-bottom: 8px;
        }

        .article-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #999;
        }

        .result-section {
            display: none;
        }

        .result-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .result-tab {
            padding: 8px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .result-tab.active {
            background: #6c5ce7;
            color: white;
            border-color: #6c5ce7;
        }

        .result-content {
            background: #f8f9ff;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.8;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c5ce7;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6c5ce7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats-card {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #6c5ce7;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
        }

        @media (max-width: 768px) {
            .stats-card {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
<div style="background:#fff;border-bottom:1px solid #eef2f7;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;font-size:14px">
  <a href="/" style="color:#333;text-decoration:none;font-weight:600">🏠 返回首页</a>
  <a href="/experience" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:20px;padding:6px 18px;text-decoration:none;font-weight:600;font-size:13px">🎯 体验中心</a>
</div>
    <div class="header">
        <h1>📝 CMS内容AI化</h1>
        <p>将已有文章一键改写为适配不同平台的衍生内容</p>
    </div>

    <div class="container">
        <div class="stats-card">
            <div class="stat-item">
                <div class="stat-value">0</div>
                <div class="stat-label">待改写文章</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">5</div>
                <div class="stat-label">支持平台</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">4</div>
                <div class="stat-label">改写模式</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">90%</div>
                <div class="stat-label">效率提升</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📚 选择文章</div>
            <div class="form-group">
                <label class="form-label">文章列表</label>
                <div class="article-list" id="articleList">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>加载文章列表中...</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">⚙️ 改写设置</div>
            
            <div class="form-group">
                <label class="form-label">改写动作</label>
                <div class="action-selector" id="actionSelector">
                    <div class="action-btn selected" data-action="rewrite">📝 改写</div>
                    <div class="action-btn" data-action="expand">📖 扩写</div>
                    <div class="action-btn" data-action="shorten">📋 缩写</div>
                    <div class="action-btn" data-action="translate">💬 通俗化</div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">目标平台（多选）</label>
                <div class="platform-selector" id="platformSelector">
                    <div class="platform-btn" data-platform="wechat">💬 微信公众号</div>
                    <div class="platform-btn" data-platform="xiaohongshu">📕 小红书</div>
                    <div class="platform-btn" data-platform="zhihu">🧠 知乎</div>
                    <div class="platform-btn" data-platform="douyin">🎵 抖音</div>
                    <div class="platform-btn" data-platform="website">🌐 官网</div>
                </div>
            </div>

            <button class="submit-btn" id="submitBtn" onclick="generateContent()">开始AI改写</button>
        </div>

        <div class="card result-section" id="resultSection">
            <div class="card-title">✨ 改写结果</div>
            <div class="result-tabs" id="resultTabs"></div>
            <div class="result-content" id="resultContent"></div>
        </div>
    </div>

    <script>
        let selectedArticle = null;
        let selectedAction = 'rewrite';
        let selectedPlatforms = ['wechat'];

        // 加载文章列表
        async function loadArticles() {
            try {
                const response = await fetch('/api/content-list?page=1&limit=50');
                const result = await response.json();
                
                if (result.success) {
                    const list = document.getElementById('articleList');
                    list.innerHTML = '';
                    
                    result.data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'article-item';
                        div.dataset.aid = item.aid;
                        div.innerHTML = `
                            <div class="article-title">${item.title}</div>
                            <div class="article-meta">
                                <span>📅 ${item.addtime}</span>
                                <span>👁️ ${item.hits}次阅读</span>
                            </div>
                        `;
                        div.addEventListener('click', () => selectArticle(div, item));
                        list.appendChild(div);
                    });
                }
            } catch (error) {
                console.error('Error loading articles:', error);
                document.getElementById('articleList').innerHTML = '<p style="text-align: center; color: #999;">加载失败，请刷新重试</p>';
            }
        }

        // 选择文章
        function selectArticle(div, item) {
            document.querySelectorAll('.article-item').forEach(el => el.classList.remove('selected'));
            div.classList.add('selected');
            selectedArticle = item;
        }

        // 选择动作
        document.getElementById('actionSelector').addEventListener('click', (e) => {
            if (e.target.classList.contains('action-btn')) {
                document.querySelectorAll('.action-btn').forEach(el => el.classList.remove('selected'));
                e.target.classList.add('selected');
                selectedAction = e.target.dataset.action;
            }
        });

        // 选择平台
        document.getElementById('platformSelector').addEventListener('click', (e) => {
            if (e.target.classList.contains('platform-btn')) {
                e.target.classList.toggle('selected');
                selectedPlatforms = Array.from(document.querySelectorAll('.platform-btn.selected'))
                    .map(el => el.dataset.platform);
            }
        });

        // 生成内容
        async function generateContent() {
            if (!selectedArticle) {
                alert('请先选择一篇文章');
                return;
            }

            if (selectedPlatforms.length === 0) {
                alert('请至少选择一个目标平台');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const resultSection = document.getElementById('resultSection');
            const resultTabs = document.getElementById('resultTabs');
            const resultContent = document.getElementById('resultContent');

            btn.disabled = true;
            btn.textContent = 'AI处理中...';
            resultSection.style.display = 'block';
            resultTabs.innerHTML = '';
            resultContent.innerHTML = '<div class="loading"><div class="loading-spinner"></div><p>AI正在改写内容...</p></div>';

            try {
                const response = await fetch('/api/content-adapt', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        aid: selectedArticle.aid,
                        platforms: selectedPlatforms
                    })
                });

                const result = await response.json();

                if (result.success) {
                    // 创建标签页
                    selectedPlatforms.forEach((platform, index) => {
                        const tab = document.createElement('div');
                        tab.className = `result-tab ${index === 0 ? 'active' : ''}`;
                        tab.textContent = getPlatformName(platform);
                        tab.dataset.platform = platform;
                        tab.addEventListener('click', () => showPlatformResult(platform, result.results));
                        resultTabs.appendChild(tab);
                    });

                    // 显示第一个平台的结果
                    showPlatformResult(selectedPlatforms[0], result.results);
                } else {
                    resultContent.innerHTML = `<p style="color: #e74c3c;">${result.message}</p>`;
                }
            } catch (error) {
                console.error('Error:', error);
                resultContent.innerHTML = '<p style="color: #e74c3c;">处理失败，请稍后重试</p>';
            } finally {
                btn.disabled = false;
                btn.textContent = '开始AI改写';
            }
        }

        // 显示平台结果
        function showPlatformResult(platform, results) {
            document.querySelectorAll('.result-tab').forEach(el => el.classList.remove('active'));
            document.querySelector(`.result-tab[data-platform="${platform}"]`).classList.add('active');
            
            const data = results[platform];
            document.getElementById('resultContent').innerHTML = `
                <h4 style="margin-bottom: 16px; color: #6c5ce7;">${data.title}</h4>
                <div>${data.content.replace(/\n/g, '<br>')}</div>
            `;
        }

        // 获取平台名称
        function getPlatformName(platform) {
            const names = {
                'wechat': '微信公众号',
                'xiaohongshu': '小红书',
                'zhihu': '知乎',
                'douyin': '抖音',
                'website': '官网'
            };
            return names[platform] || platform;
        }

        // 初始化
        loadArticles();
    </script>
</body>
</html>
