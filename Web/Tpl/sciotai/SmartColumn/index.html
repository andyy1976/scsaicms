<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS智能栏目生成 - 内容数字员工</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1f4e;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: #5b4cdb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108,92,231,0.3);
        }

        .btn-secondary {
            background: #fff;
            color: #6c5ce7;
            border: 1px solid #6c5ce7;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(108,92,231,0.05);
        }

        .btn-danger {
            background: #fff;
            color: #dc3545;
            border: 1px solid #dc3545;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-danger:hover {
            background: #f8d7da;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #6c5ce7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(108,92,231,0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #6c5ce7;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
        }

        .category-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .category-card {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 24px;
            border-left: 4px solid #6c5ce7;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .category-name {
            font-size: 18px;
            font-weight: 700;
            color: #1a1f4e;
        }

        .category-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
        }

        .stat-item {
            font-size: 14px;
        }

        .stat-item strong {
            font-size: 18px;
            color: #6c5ce7;
        }

        .category-articles {
            max-height: 200px;
            overflow-y: auto;
        }

        .article-item {
            padding: 10px;
            background: white;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .article-title {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
            border-radius: 4px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #1a1f4e;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .trend-chart {
            height: 200px;
            position: relative;
        }

        .chart-bar {
            display: flex;
            align-items: flex-end;
            height: 100%;
            gap: 10px;
        }

        .bar {
            flex: 1;
            background: linear-gradient(180deg, #6c5ce7, #a29bfe);
            border-radius: 4px 4px 0 0;
            position: relative;
        }

        .bar-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #666;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧠 CMS智能栏目生成</h1>
        <p>基于内容聚类与阅读数据，自动生成最优栏目结构</p>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-title">⚙️ 生成参数设置</div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                <div class="form-group">
                    <label>期望栏目数量</label>
                    <select id="categoryCount">
                        <option value="3">3个</option>
                        <option value="5" selected>5个</option>
                        <option value="8">8个</option>
                        <option value="10">10个</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>最小文章数</label>
                    <select id="minArticles">
                        <option value="1">1篇</option>
                        <option value="3" selected>3篇</option>
                        <option value="5">5篇</option>
                        <option value="10">10篇</option>
                    </select>
                </div>
                <div class="form-group" style="align-self: flex-end;">
                    <button class="btn-primary" onclick="generateCategories()">
                        <i></i> 智能生成栏目
                    </button>
                </div>
            </div>
        </div>

        <div class="card" id="analysisCard" style="display: none;">
            <div class="card-title">📊 内容分析概览</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalArticles">0</div>
                    <div class="stat-label">总文章数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalHits">0</div>
                    <div class="stat-label">总阅读量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avgHits">0</div>
                    <div class="stat-label">平均阅读量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="categoryCount">0</div>
                    <div class="stat-label">现有栏目数</div>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <h4 style="margin-bottom: 15px; color: #1a1f4e;">📈 月度发布趋势</h4>
                <div class="trend-chart">
                    <div class="chart-bar" id="trendChart">
                        <div style="color: #999; text-align: center; padding-top: 50px;">加载中...</div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <h4 style="margin-bottom: 15px; color: #1a1f4e;">🔥 热门文章TOP10</h4>
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="padding: 10px; text-align: left; background: #f8f9fc; font-size: 13px;">排名</th>
                            <th style="padding: 10px; text-align: left; background: #f8f9fc; font-size: 13px;">标题</th>
                            <th style="padding: 10px; text-align: right; background: #f8f9fc; font-size: 13px;">阅读量</th>
                        </tr>
                    </thead>
                    <tbody id="topArticlesTable">
                        <tr><td colspan="3" style="text-align: center; color: #999; padding: 20px;">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card" id="categoryCard" style="display: none;">
            <div class="card-title">🏷️ 智能生成栏目</div>
            <div class="category-list" id="categoryList">
                <div style="color: #999; text-align: center; padding: 40px;">点击"智能生成栏目"按钮开始</div>
            </div>
        </div>

        <div class="card" id="optimizeCard" style="display: none;">
            <div class="card-title">⚡ 栏目优化操作</div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                <div class="form-group">
                    <label>操作类型</label>
                    <select id="actionType">
                        <option value="create">创建新栏目</option>
                        <option value="rename">重命名栏目</option>
                        <option value="merge">合并栏目</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>栏目名称</label>
                    <input type="text" id="columnName" placeholder="输入栏目名称">
                </div>
                <div class="form-group" style="align-self: flex-end;">
                    <button class="btn-primary" onclick="optimizeColumn()">执行操作</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle">确认操作</h3>
            <p id="modalMessage">确定要执行此操作吗？</p>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn-primary" onclick="confirmModal()">确定</button>
            </div>
        </div>
    </div>

    <script>
        let currentAction = null;

        async function generateCategories() {
            const categoryCount = document.getElementById('categoryCount').value;
            const minArticles = document.getElementById('minArticles').value;

            try {
                const response = await fetch('/api/smart-column/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ categoryCount, minArticles })
                });
                const result = await response.json();

                if (result.success) {
                    renderCategories(result.data);
                    document.getElementById('categoryCard').style.display = 'block';
                    document.getElementById('optimizeCard').style.display = 'block';
                    loadAnalysis();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('生成失败，请重试');
            }
        }

        async function loadAnalysis() {
            try {
                const response = await fetch('/api/smart-column/analyze');
                const result = await response.json();

                if (result.success) {
                    const data = result.data;
                    document.getElementById('totalArticles').textContent = data.totalArticles;
                    document.getElementById('totalHits').textContent = data.totalHits;
                    document.getElementById('avgHits').textContent = data.avgHits;
                    document.getElementById('categoryCount').textContent = Object.keys(data.categoryStats).length;

                    renderTrendChart(data.monthlyTrend);
                    renderTopArticles(data.topArticles);
                    document.getElementById('analysisCard').style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading analysis:', error);
            }
        }

        function renderTrendChart(trend) {
            const chart = document.getElementById('trendChart');
            chart.innerHTML = '';

            const months = Object.keys(trend);
            const maxCount = Math.max(...Object.values(trend).map(t => t.count));

            months.forEach(month => {
                const count = trend[month].count;
                const height = maxCount > 0 ? (count / maxCount) * 100 : 0;
                
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.height = height + '%';
                
                const label = document.createElement('div');
                label.className = 'bar-label';
                label.textContent = month.slice(5);
                
                bar.appendChild(label);
                chart.appendChild(bar);
            });
        }

        function renderTopArticles(articles) {
            const tbody = document.getElementById('topArticlesTable');
            tbody.innerHTML = '';

            articles.forEach((article, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="padding: 10px; font-weight: 600; color: #6c5ce7;">${index + 1}</td>
                    <td style="padding: 10px;">${article.title}</td>
                    <td style="padding: 10px; text-align: right;">${article.hits}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderCategories(categories) {
            const list = document.getElementById('categoryList');
            list.innerHTML = '';

            categories.forEach(category => {
                const card = document.createElement('div');
                card.className = 'category-card';
                
                const articlesHtml = category.articles.slice(0, 5).map(article => `
                    <div class="article-item">
                        <span class="article-title" title="${article.title}">${article.title}</span>
                        <span style="color: #999; font-size: 12px;">${article.hits}阅读</span>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="category-header">
                        <div class="category-name">${category.name}</div>
                        <button class="btn-secondary" onclick="createColumn('${category.name}')">创建此栏目</button>
                    </div>
                    <div class="category-stats">
                        <div class="stat-item"><strong>${category.articleCount}</strong> 篇文章</div>
                        <div class="stat-item"><strong>${category.totalHits}</strong> 总阅读</div>
                        <div class="stat-item"><strong>${category.avgHits}</strong> 平均阅读</div>
                    </div>
                    <div style="margin-bottom: 10px;">
                        <span style="font-size: 13px; color: #666;">关键词：</span>
                        <span style="font-size: 12px; color: #6c5ce7;">${category.keywords.slice(0, 3).join('、')}</span>
                    </div>
                    <div class="category-articles">
                        ${articlesHtml}
                        ${category.articleCount > 5 ? `<div style="text-align: center; color: #999; font-size: 12px; padding: 5px;">还有${category.articleCount - 5}篇...</div>` : ''}
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function createColumn(name) {
            document.getElementById('actionType').value = 'create';
            document.getElementById('columnName').value = name;
            optimizeColumn();
        }

        function optimizeColumn() {
            const action = document.getElementById('actionType').value;
            const name = document.getElementById('columnName').value;

            if (!name) {
                alert('请输入栏目名称');
                return;
            }

            currentAction = { action, name };

            let message = '';
            if (action === 'create') {
                message = `确定要创建栏目「${name}」吗？`;
            } else if (action === 'rename') {
                message = `确定要重命名栏目为「${name}」吗？`;
            } else if (action === 'merge') {
                message = `确定要合并栏目到「${name}」吗？`;
            }

            document.getElementById('modalTitle').textContent = '确认操作';
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            currentAction = null;
        }

        async function confirmModal() {
            if (!currentAction) return;

            try {
                const response = await fetch('/api/smart-column/optimize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(currentAction)
                });
                const result = await response.json();

                if (result.success) {
                    alert(result.message);
                    document.getElementById('columnName').value = '';
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('操作失败');
            }

            closeModal();
        }
    </script>
</body>
</html>
